<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>КОЭФФИЦИЕНТ — Футбольные прогнозы</title>

  <div id="app">

        </div>
      </div>
      <p class="loader-text">Загрузка...</p>

          <div class="logo">КОЭФФИЦИЕНТ</div>
        </div>
        <div class="header-right" id="header-user"></div>
      </header>

      <main id="content" class="content"></main>

      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-btn active" data-page="home">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg></span>

        <button class="nav-btn" data-page="matches">

          <span class="nav-label">Матчи</span>
        </button>
        <button class="nav-btn" data-page="express">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 10-13h-7l1-7z"/></svg></span>
          <span class="nav-label">Экспресс</span>

        <button class="nav-btn" data-page="account">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4-5 8-5s6.5 1.5 8 5"/></svg></span>
