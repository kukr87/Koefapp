<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Koefii — Футбольные прогнозы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Loading -->
    <div id="loader" class="loader-screen">
      <div class="pitch">
        <div class="ball"></div>
      </div>
      <p class="loader-text">Загрузка Koefii...</p>
    </div>

    <!-- Main App -->
    <div id="main" class="hidden">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <div class="logo">⚽ KOEFII</div>
        </div>
        <div class="header-right" id="header-user">
          <img id="header-avatar" class="avatar" src="" alt="" />
        </div>
      </header>

      <!-- Content -->
      <main id="content" class="content"></main>

      <!-- Bottom Nav -->
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-btn active" data-page="home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Главная</span>
        </button>
        <button class="nav-btn" data-page="matches">
          <span class="nav-icon">⚽</span>
          <span class="nav-label">Матчи</span>
        </button>
        <button class="nav-btn" data-page="express">
          <span class="nav-icon">🚆</span>
          <span class="nav-label">Экспресс</span>
        </button>
        <button class="nav-btn" data-page="account">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Аккаунт</span>
        </button>
        <button class="nav-btn" data-page="support">
          <span class="nav-icon">✉️</span>
          <span class="nav-label">Поддержка</span>
        </button>
        <!-- Admin button injected by JS if is_admin -->
      </nav>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
